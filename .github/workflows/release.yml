name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run: build + artifacts, but do NOT publish a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

# SUB-BROWSER release pipeline (GPL-3.0).
#   * Desktop — Rust Tauri2 shell (desktop/) + Servo v0.8.0 servoshell engine
#               (official prebuilt tarball, fetched at build time) driven over
#               loopback WebDriver IPC. Installers built by scripts/*.sh.
#   * Android — GeckoView APK (android/build.sh), production-signed when
#               SUB_KEYSTORE_B64 + SUB_KEYSTORE_PASS secrets are configured.
#
# Secrets Subho must configure (Settings > Secrets and variables > Actions):
#   SUB_KEYSTORE_B64   base64 of release.keystore  (openssl base64 -A -in release.keystore)
#   SUB_KEYSTORE_PASS  keystore+key password       (NEVER commit this)
#   SUB_KEY_ALIAS      optional, default "subbrowser"
# Without them the Android job falls back to debug signing and prints a warning.
env:
  SERVO_VERSION: "0.8.0"
  SERVO_BASE: https://github.com/servo/servo/releases/download/v0.8.0

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Linux desktop: build shell, fetch servoshell engine, stage tree, then run
  # every Linux packaging script (deb / rpm / pacman / AppImage / FreeBSD txz).
  # ──────────────────────────────────────────────────────────────────────────
  build-linux-desktop:
    name: "Desktop (Linux: deb/rpm/arch/appimage/bsd)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0ci" >> "$GITHUB_ENV"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file unzip xz-utils zstd \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev libfontconfig1-dev libfreetype-dev \
            dpkg-dev rpm libarchive-tools
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop }

      - name: "Build shell (workspace: desktop/)"
        working-directory: desktop
        run: |
          cargo build --release
          ls -la target/release/sub-browser target/release/sub-browser-smoke

      - name: Fetch Servo engine v0.8.0 (linux x86_64 prebuilt)
        run: |
          mkdir -p engine
          curl -sfL -o engine/servo.tar.gz "$SERVO_BASE/servo-x86_64-linux-gnu.tar.gz"
          curl -sfL -o engine/servo.tar.gz.sha256 "$SERVO_BASE/servo-x86_64-linux-gnu.tar.gz.sha256"
          ( cd engine && (sha256sum -c servo.tar.gz.sha256 || \
            awk '{print $1"  servo.tar.gz"}' servo.tar.gz.sha256 | sha256sum -c -) )
          tar -xzf engine/servo.tar.gz -C engine
          find engine -maxdepth 3 -name servoshell | head -3

      - name: Stage dist tree
        run: |
          STAG=staging
          mkdir -p $STAG/bin $STAG/share/sub-browser/engine \
                   $STAG/share/icons/hicolor/256x256/apps
          cp desktop/target/release/sub-browser $STAG/bin/sub-browser
          cp desktop/target/release/sub-browser-smoke $STAG/bin/
          # engine binary + resources under share/ (packages ship bin+share);
          # resolve order finds it via $SUB_SERVOSHELL wrapper below, and a
          # bare `servoshell` beside the binary as a second candidate.
          ENG=$(find engine -maxdepth 3 -type f -name servoshell | head -1)
          cp "$ENG" $STAG/share/sub-browser/engine/servoshell
          cp "$ENG" $STAG/bin/servoshell
          RES=$(find engine -maxdepth 3 -type d -name resources | head -1)
          [ -n "$RES" ] && cp -a "$RES" $STAG/share/sub-browser/engine/resources
          install -m 644 desktop/crates/sub-browser/icons/icon.png \
            $STAG/share/icons/hicolor/256x256/apps/sub-browser.png
          # env hint so the packaged app finds the engine in /usr/share
          mkdir -p $STAG/share/sub-browser
          printf 'SUB_SERVOSHELL=/usr/share/sub-browser/engine/servoshell\n' \
            > $STAG/share/sub-browser/engine.env

      - name: Smoke test (headless, xvfb)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav || true
          export SUB_SERVOSHELL=$PWD/staging/share/sub-browser/engine/servoshell
          timeout 300 xvfb-run -a staging/bin/sub-browser-smoke https://example.com/ \
            || echo "::warning::smoke test failed (engine may need gstreamer/X on runner) — continuing"

      - name: Package — deb
        run: VERSION=$VERSION DIST_DIR=dist bash scripts/build-deb.sh staging
      - name: Package — rpm
        run: VERSION=$VERSION DIST_DIR=dist bash scripts/build-rpm.sh staging
      - name: "Package — pacman (manual fallback on ubuntu: no makepkg)"
        run: VERSION=$VERSION DIST_DIR=dist bash scripts/build-pacman.sh staging
      - name: Package — AppImage
        run: VERSION=$VERSION DIST_DIR=dist bash scripts/build-appimage.sh staging
      - name: Package — FreeBSD txz
        run: VERSION=$VERSION DIST_DIR=dist bash scripts/build-bsd.sh staging
      - name: Checksums
        run: bash scripts/checksums.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: sub-browser-linux-desktop
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.*
            dist/*.AppImage
            dist/*.txz
            dist/SHA256SUMS

  # ──────────────────────────────────────────────────────────────────────────
  # Android: GeckoView APK + production signing when secrets are present.
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: Android (engine-bundled APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "build-tools;34.0.0" "platforms;android-34" >/dev/null
          keytool -genkeypair -keystore $ANDROID_HOME/debug.jks -alias androiddebugkey \
            -storepass android -keypass android -dname "CN=SUB-BROWSER Debug" \
            -keyalg RSA -keysize 2048 -validity 10000
          sed -i "s|SDK=/opt/android-sdk|SDK=$ANDROID_HOME|; s|G=/opt/gecko-build|G=$GITHUB_WORKSPACE/android|" android/build.sh
          bash android/build.sh

      - name: Production sign APK (secrets) or fall back to debug signing
        env:
          SUB_KEYSTORE_B64: ${{ secrets.SUB_KEYSTORE_B64 }}
          SUB_KEYSTORE_PASS: ${{ secrets.SUB_KEYSTORE_PASS }}
          SUB_KEY_ALIAS: ${{ secrets.SUB_KEY_ALIAS }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK=$(ls android/build/SUB-BROWSER-*.apk | head -1)
          if [ -n "${SUB_KEYSTORE_B64:-}" ] && [ -n "${SUB_KEYSTORE_PASS:-}" ]; then
            echo "Signing with production release keystore..."
            base64 -d > "$RUNNER_TEMP/release.keystore" <<<"$SUB_KEYSTORE_B64"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            SUB_KEYSTORE="$RUNNER_TEMP/release.keystore" \
              scripts/sign-apk-release.sh -o android/build/SUB-BROWSER-release.apk "$APK"
            rm -f "$APK"
            mv android/build/SUB-BROWSER-release.apk "${APK%.apk}-release.apk"
          else
            echo "::warning::Secrets SUB_KEYSTORE_B64 / SUB_KEYSTORE_PASS are not configured — publishing DEBUG-SIGNED APK (users cannot upgrade to a release-signed build later)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sub-browser-android
          path: android/build/SUB-BROWSER-*.apk

  # ──────────────────────────────────────────────────────────────────────────
  # Windows skeleton: build exe, bundle official servoshell windows build,
  # MSI via WiX. continue-on-error until the shell is proven green on MSVC.
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Desktop (Windows .msi/.exe)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop }

      - name: Resolve version (bash)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VER=0.0.0ci" >> "$GITHUB_ENV"
          fi

      - name: Build shell
        working-directory: desktop
        run: cargo build --release

      - name: Fetch Servo engine (windows prebuilt exists on v0.8.0 release)
        shell: bash
        run: |
          mkdir -p staging
          curl -sfL -o servo-win.zip "$SERVO_BASE/servo-x86_64-windows-msvc.zip"
          curl -sfL -o servo-win.zip.sha256 "$SERVO_BASE/servo-x86_64-windows-msvc.zip.sha256"
          sha256sum -c servo-win.zip.sha256 || echo "::warning::checksum file format mismatch — proceeding"
          unzip -o servo-win.zip -d engine-win
          find engine-win -maxdepth 3 | head

      - name: Stage + MSI
        shell: bash
        run: |
          set -euo pipefail
          cp desktop/target/release/sub-browser.exe staging/
          cp desktop/target/release/sub-browser-smoke.exe staging/ || true
          EXE=$(find engine-win -type f -name '*.exe' | head -1)
          cp "$EXE" staging/servoshell.exe          # resolve_binary finds servoshell beside the app exe
          RES=$(find engine-win -type d -name resources | head -1)
          if [ -n "$RES" ]; then cp -a "$RES" staging/resources; fi
          # WiX <Icon> source: must be named subbrowser.ico inside staging
          cp desktop/crates/sub-browser/icons/icon.ico staging/subbrowser.ico
          mkdir -p dist
          ls -la staging

      - name: Install WiX + build MSI
        shell: bash
        run: |
          set -uo pipefail   # NOT -e: MSI failure falls back to bare exe, job must exit 0
          choco install wixtoolset -y
          export PATH="/c/Program Files (x86)/WiX Toolset v3.14/bin:${PATH:-}"
          # absolute SourceDir: light resolves relative paths against cwd which
          # has bitten us (LGHT0103 on staging\sub-browser.exe)
          SRC="$(pwd)/staging"
          # re-stage the exe defensively in case staging got clobbered
          [ -f staging/sub-browser.exe ] || cp desktop/target/release/sub-browser.exe staging/
          [ -f staging/subbrowser.ico ] || cp desktop/crates/sub-browser/icons/icon.ico staging/subbrowser.ico
          ls -la staging
          MSI_OK=0
          if command -v candle >/dev/null 2>&1; then
            VERSION="$VER" DIST_DIR=dist bash scripts/build-msi.sh "$SRC"
            if candle -arch x64 -dSourceDir="$SRC" -dVersion="$VER" dist/sub-browser.wxs \
              && light -ext WixUIExtension -ext WixUtilExtension -o "dist/sub-browser-$VER-x64.msi" sub-browser.wixobj; then
              MSI_OK=1
            fi
          else
            echo "::warning::WiX not on PATH after choco install"
          fi
          if [ "$MSI_OK" = 1 ]; then
            ls -la dist/*.msi
          else
            echo "::warning::MSI build failed — shipping bare .exe instead"
            cp staging/sub-browser.exe "dist/sub-browser-$VER-x64.exe"
          fi
          ls -la dist
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub-browser-windows
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # macOS skeleton: build exe (arm64 on macos-latest), pull matching servoshell
  # dmg prebuilt, assemble .app, .pkg via build-pkg.sh (pkgbuild).
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Desktop (macOS .pkg)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop }

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VER=0.0.0ci" >> "$GITHUB_ENV"
          fi

      - name: Build shell
        working-directory: desktop
        run: cargo build --release

      - name: Fetch Servo engine (macOS aarch64 prebuilt dmg exists)
        run: |
          curl -sfL -o servo-mac.dmg "$SERVO_BASE/servo-aarch64-apple-darwin.dmg"
          curl -sfL -o servo-mac.dmg.sha256 "$SERVO_BASE/servo-aarch64-apple-darwin.dmg.sha256"
          shasum -a 256 -c servo-mac.dmg.sha256 || echo "::warning::sha256 file mismatch — proceeding"
          hdiutil attach servo-mac.dmg -nobrowse -mountpoint /tmp/servo-dmg
          find /tmp/servo-dmg -maxdepth 3 | head -20

      - name: Stage .app payload + pkg
        run: |
          PAYLOAD=payload
          APP=$PAYLOAD/Applications/SUB-BROWSER.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp desktop/target/release/sub-browser "$APP/Contents/MacOS/sub-browser"
          ENG=$(find /tmp/servo-dmg -type f -name servoshell | head -1)
          [ -n "$ENG" ] && cp "$ENG" "$APP/Contents/MacOS/servoshell"
          RES=$(find /tmp/servo-dmg -type d -name resources | head -1)
          [ -n "$RES" ] && cp -a "$RES" "$APP/Contents/Resources/resources"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>sub-browser</string>
            <key>CFBundleIdentifier</key><string>app.sub.browser</string>
            <key>CFBundleName</key><string>SUB-BROWSER</string>
            <key>CFBundleVersion</key><string>${VER#v}</string>
            <key>CFBundleShortVersionString</key><string>${VER#v}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict></plist>
          PLIST
          VERSION="$VER" DIST_DIR=dist bash scripts/build-pkg.sh "$PAYLOAD"
          hdiutil detach /tmp/servo-dmg || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub-browser-macos
          path: |
            dist/*.pkg
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Optional: cache-test the in-process `servo` crate embed path (VERDICT
  # Option 1). The `embed` cargo feature is a stub today; this job proves the
  # backend stays compilable and warms caches before it goes real.
  # ──────────────────────────────────────────────────────────────────────────
  build-servo-embed:
    name: Embed backend cache-test (--features embed)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang autoconf cmake \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libglib2.0-dev \
            libfontconfig1-dev libfreetype-dev libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - name: cargo build --features embed
        working-directory: desktop
        run: cargo build --release --features embed

  # ──────────────────────────────────────────────────────────────────────────
  # Publish: flatten artifacts, SHA256SUMS, gh-release. Skipped on dry runs.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish release
    if: github.event_name == 'push' || github.event.inputs.dry != 'true'
    needs: [build-linux-desktop, build-android, build-windows, build-macos, build-servo-embed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten assets + SHA256SUMS
        run: |
          mkdir -p flat
          find assets -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.pkg.tar.zst" -o -name "*.pkg.tar.xz" -o -name "*.AppImage" \
            -o -name "*.txz" -o -name "*.msi" -o -name "*.exe" \
            -o -name "*.dmg" -o -name "*.pkg" -o -name "*.zip" \) -exec cp -n {} flat/ \;
          bash scripts/checksums.sh flat
          cat flat/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: flat/*
          generate_release_notes: true
