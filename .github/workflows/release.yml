name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# SUB-BROWSER release pipeline.
# Product editions (Gecko engine everywhere):
#   * Desktop  — native Rust browser (multi-OS installers)
#   * Android  — GeckoView, engine bundled in the APK, production-signed
jobs:
  build-android:
    name: Android (engine-bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "build-tools;34.0.0" "platforms;android-34" >/dev/null
          keytool -genkeypair -keystore $ANDROID_HOME/debug.jks -alias androiddebugkey \
            -storepass android -keypass android -dname "CN=SUB-BROWSER Debug" \
            -keyalg RSA -keysize 2048 -validity 10000
          sed -i "s|SDK=/opt/android-sdk|SDK=$ANDROID_HOME|; s|G=/opt/gecko-build|G=$GITHUB_WORKSPACE/android|" android/build.sh
          bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sub-browser-android
          path: android/build/SUB-BROWSER-*.apk

  build-deb:
    name: Desktop (.deb)
    runs-on: ubuntu-latest
    # Packaging script not wired yet (scripts/package-deb.sh) — placeholder.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: test -f scripts/package-deb.sh && bash scripts/package-deb.sh || { echo "packaging script not yet wired"; exit 1; }

  build-rpm:
    name: Desktop (.rpm)
    runs-on: ubuntu-latest
    # Packaging script not wired yet (scripts/package-rpm.sh) — placeholder.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: test -f scripts/package-rpm.sh && bash scripts/package-rpm.sh || { echo "packaging script not yet wired"; exit 1; }

  build-arch:
    name: Desktop (Arch / .pkg.tar.zst)
    runs-on: ubuntu-latest
    # Packaging script not wired yet (scripts/package-arch.sh) — placeholder.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: test -f scripts/package-arch.sh && bash scripts/package-arch.sh || { echo "packaging script not yet wired"; exit 1; }

  build-windows:
    name: Desktop (Windows .msi/.exe)
    runs-on: windows-latest
    # Packaging script not wired yet (scripts/package-windows.ps1) — placeholder.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: test -f scripts/package-windows.ps1 && bash -c 'echo "wire me"; exit 1' || { echo "packaging script not yet wired"; exit 1; }

  build-macos:
    name: Desktop (macOS .dmg/.pkg)
    runs-on: macos-latest
    # Packaging script not wired yet (scripts/package-macos.sh) — placeholder.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: test -f scripts/package-macos.sh && bash scripts/package-macos.sh || { echo "packaging script not yet wired"; exit 1; }

  release:
    name: Publish release
    needs: [build-android, build-deb, build-rpm, build-arch, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten assets
        run: |
          mkdir -p flat
          find assets -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.pkg.tar.zst" -o -name "*.msi" -o -name "*.exe" \
            -o -name "*.dmg" -o -name "*.pkg" -o -name "*.zip" \) -exec cp {} flat/ \;
          cd flat && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: flat/*
          generate_release_notes: true
