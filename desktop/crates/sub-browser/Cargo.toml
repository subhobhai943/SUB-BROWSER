[package]
name = "sub-browser"
version = "0.2.0"
edition = "2021"
description = "SUB-BROWSER desktop shell v2 — Tauri2 chrome + Servo engine over WebDriver IPC"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "6"

[features]
default = []
# `embed`: in-process `servo` crate backend (Option 1). See docs/ENGINE.md.
# Enabled only once the servo crate compile is green on CI (60-150 min cold
# build for mozjs/SpiderMonkey C++ — see /opt/gecko-desktop/VERDICT.md).
embed = []

[profile.release]
strip = true
codegen-units = 1
[[bin]]
name = "sub-browser-smoke"
path = "src/bin/sub_browser_smoke.rs"
